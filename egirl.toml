# CLI color theme: egirl (purple/pink), midnight (blue/teal), neon (green/cyan), mono (grayscale)
theme = "egirl"

# Extended thinking / reasoning controls (Qwen3 /think mode)
# Override per-session in CLI with: /think <level>
[thinking]
level = "off"                            # off, low, medium, high
# budget_tokens = 8192                   # override budget (default: auto from level)
show_thinking = true                     # display thinking output in CLI

[workspace]
path = "~/.egirl/workspace"

[local]
endpoint = "http://localhost:8099"       # sabrewing qwen35 via openai_server.py
model = "qwen3.5-35b-a3b-sabrewing"      # for display/logging only
context_length = 16384                   # must match the engine's CTX_MAX
max_concurrent = 1                       # qwen35's serve loop is SERIAL: a second request
                                         # would queue server-side and burn the stale-stream
                                         # timeout waiting for a slot. Now enforced.
cache_slots = 0                          # qwen35 has no slot pool / prefix reuse yet, so
                                         # pinning would do nothing
tool_format = "qwen35"                   # auto | qwen3 | qwen35 | laguna — speak Qwen3.5's
                                         # own <function=>/<parameter=> syntax both ways
stale_stream_timeout_ms = 900000         # CPU-only: ~30 tok/s prefill means a 5k-token
                                         # agent context is ~3 min before the first token

[local.embeddings]
provider = "qwen3-vl"                    # Python service using transformers
endpoint = "http://localhost:8082"
model = "qwen3-vl-embedding-2b"
dimensions = 2048
multimodal = true

[channels.discord]
allowed_channels = ["dm"]                # or specific channel IDs
allowed_users = []                       # set your Discord user ID

[channels.code_agent]
provider = "codex"                       # codex or claude
permission_mode = "default"              # default, acceptEdits, bypassPermissions, plan
# model = "gpt-5.5"                      # optional backend model
# working_dir = "~/projects/myrepo"      # defaults to workspace
# max_turns = 30                         # Claude backend only

# Direct Claude Code bridge command only: bun run start cc
# [channels.claude_code]
# permission_mode = "bypassPermissions"
# model = "sonnet"

# XMPP bot — self-hosted chat (e.g. Prosody on localhost or a VPS).
# Requires XMPP_USERNAME and XMPP_PASSWORD in .env.
# [channels.xmpp]
# service = "xmpp://localhost:5222"     # or "xmpps://chat.example.com:5223" for TLS
# domain = "localhost"                   # inferred from service if omitted
# resource = "egirl"
# allowed_jids = ["you@localhost"]      # empty = allow all

# HTTP API — localhost by default, for scripts / mobile / automations.
# Set EGIRL_API_TOKEN in .env to require a bearer token (recommended if exposing on LAN).
[channels.api]
host = "127.0.0.1"
port = 3000

[safety]
enabled = true

[safety.command_filter]
enabled = true
# blocked_patterns = ["npm\\s+publish"]

[safety.path_sandbox]
enabled = false
# allowed_paths = ["{workspace}", "~/projects"]

[safety.sensitive_files]
enabled = true

[safety.audit_log]
enabled = true
path = "{workspace}/audit.log"

[safety.confirmation]
enabled = false
# tools = ["execute_command", "write_file", "edit_file"]

[tasks]
max_concurrent_tasks = 4                 # the real concurrency knob: concurrent background
                                         # tasks each drive a local-model call, which is what
                                         # sabrewing's batched decode is for

[tools]
code_agent = true                        # enable configured code-agent delegation

[skills]
dirs = ["~/.egirl/skills", "{workspace}/skills"]
