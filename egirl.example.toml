# CLI color theme: egirl (purple/pink), midnight (blue/teal), neon (green/cyan), mono (grayscale)
theme = "egirl"

[thinking]
level = "off"
show_thinking = true

[workspace]
path = "~/.egirl/workspace"

[local]
endpoint = "http://localhost:8080"
model = "qwen3-vl-32b"
context_length = 32768
max_concurrent = 2                 # in-flight requests against the endpoint; set to 1 for a
                                   # serial engine, 0 to disable the limit
# tool_format = "auto"             # auto | qwen3 | qwen35 | laguna — which tool-call syntax to
                                   # ask for and parse. "auto" asks in Qwen3 form and accepts
                                   # any of them back; name the model's own dialect when you
                                   # know it (Qwen3.5 uses <function=>/<parameter=>).
# cache_slots = 0                  # >0 pins a session to a server KV slot (sabrewing only)
# stale_stream_timeout_ms = 90000   # raise well above your worst-case prefill time

# [local.auxiliary]
# A second, smaller model for side work: compaction summaries and memory extraction.
# These run on every compaction and every few turns. They do not need the operator model's
# capability, but they do occupy its slot and compete for its context while they run — a summary
# generated under context pressure is how a long research task loses the thread.
# endpoint = "http://localhost:8099"   # defaults to the main endpoint
# model = "qwen3-vl-4b"
# max_concurrent = 1
# temperature = 0                      # default; summaries want determinism, not variety

# Optional. Uncomment when you have an embeddings service running to enable memory.

[local.embeddings]
# provider = "qwen3-vl"
# endpoint = "http://localhost:8082"
# model = "qwen3-vl-embedding-2b"
# dimensions = 2048
# multimodal = true

[channels.code_agent]
provider = "codex"         # "codex", "claude", or "opencode"
# providers = ["codex", "opencode", "claude"]
#   Ordered fallback chain, tried left to right. Takes precedence over `provider`.
#   The next backend is tried only when this one could not run the task at all: binary missing,
#   expired credentials, exhausted credits, rate limit, or an empty transcript. An agent that ran
#   and reported it could not solve the problem is NOT retried — that is its answer, and running
#   another agent over the same tree costs more and risks conflicting edits.
permission_mode = "default"
# model = "gpt-5.5"        # Codex example
# model = "sonnet"         # Claude example
# model = "anthropic/claude-sonnet-4-5"  # opencode example
# working_dir = "~/projects/myrepo"
# max_turns = 30           # Claude backend only

# Direct Claude Code bridge command only: bun run start cc
# [channels.claude_code]
# permission_mode = "bypassPermissions"
# model = "sonnet"

# Discord bot. Requires DISCORD_TOKEN in .env.
# [channels.discord]
# allowed_channels = ["dm"]
# allowed_users = []

# Matrix bot, unencrypted rooms only. Requires MATRIX_ACCESS_TOKEN
# (or MATRIX_USERNAME + MATRIX_PASSWORD) in .env.
# [channels.matrix]
# homeserver = "https://matrix.example.com"
# allowed_users = ["@you:example.com"]  # MXIDs; empty = allow all
# allowed_rooms = []                     # room IDs; empty = any room the bot is in
# auto_join = true                       # accept invites from allowed users

# HTTP API. Set EGIRL_API_TOKEN in .env if exposing beyond localhost.
# [channels.api]
# host = "127.0.0.1"
# port = 3000

# Cross-egirl agent-to-agent messaging (egirl-peer protocol, see docs/peers.md).
# Each peer is another egirl instance with its HTTP API running. If the peer
# sets EGIRL_API_TOKEN, put the same value in EGIRL_PEER_<NAME>_TOKEN in .env.
# [[peers]]
# name = "luna"
# url = "http://192.168.1.20:3000"
# timeout_ms = 120000

[safety]
enabled = true

[safety.command_filter]
enabled = true

[safety.path_sandbox]
enabled = false
# allowed_paths = ["{workspace}", "~/projects"]

[safety.sensitive_files]
enabled = true

[safety.audit_log]
enabled = true
path = "{workspace}/audit.log"

[tools]
code_agent = true
github = false
tasks = false
browser = false

# Real-profile browsing: browse as YOU, with your existing logins and cookies.
# When on, egirl snapshots your default Chromium browser's active profile
# (cookies, logins, preferences — never caches/extensions/history) into
# {workspace}/browser-profile/ and drives that snapshot with your real browser
# binary. Your live profile is never opened directly. Auth files re-sync from
# your real profile on every fresh launch; turning the toggle off deletes the
# snapshot store on next browser use. This is a consent-gated convenience, not
# an isolation boundary — pages the agent visits run with your real logins.
[browser]
use_real_profile = false
# executable_path = "/usr/bin/google-chrome"  # override the detected binary

[permission_supervisor]
mode = "supervised"                # bypass, supervised, rules_only, ask_user
default_action = "allow"           # allow, deny, ask_user
think_before_deciding = true
min_confidence = 0.65
ask_user_below_confidence = false
memory_recall = true
memory_write = false

[permission_supervisor.policy]
allow = [
  "git status",
  "bun test",
]
deny = [
  "rm -rf",
  ".env",
]
ask_user = [
  "git push",
  "curl",
]

[skills]
dirs = ["~/.egirl/skills", "{workspace}/skills"]

# Optional multi-instance layout. Use with: bun run start --instance kira-local cli
# Top-level config above stays valid and acts as the base. Profiles, personas,
# and instances use the same nested keys as the config above (no flat syntax);
# unknown keys are rejected at load time.
#
# [defaults]
# workspace_root = "~/.egirl"
# profile = "local-codex"
# persona = "kira"
#
# [profiles.local-codex.local]
# endpoint = "http://localhost:8080"
# model = "qwen3-vl-32b"
#
# [profiles.local-codex.channels.code_agent]
# provider = "codex"
# permission_mode = "default"
#
# [profiles.big-box.local]
# endpoint = "http://192.168.8.218:8080"
# model = "qwen3-72b"
#
# [profiles.big-box.channels.code_agent]
# provider = "codex"
# permission_mode = "default"
#
# [personas.kira]
# theme = "egirl"
# # workspace defaults to ~/.egirl/personas/kira
#
# [personas.ops]
# theme = "midnight"
#
# [instances.kira-local]
# profile = "local-codex"
# persona = "kira"
#
# [instances.ops-big]
# profile = "big-box"
# persona = "ops"
#
# [instances.ops-big.channels.api]
# port = 3001

# Resolve peers from a Wald agent registry instead of listing them above. Discovery supplies
# addresses only -- tokens still come from EGIRL_PEER_<NAME>_TOKEN. Config wins on a name
# collision, and an unreachable registry leaves the static peers untouched.
# [peer_discovery]
# enabled = true
# registry = "wald"                      # name of the [[mcp.servers]] entry
# self_url = "http://192.168.1.10:3000"  # so other instances can reach this one
# capabilities = ["coding", "vision"]
