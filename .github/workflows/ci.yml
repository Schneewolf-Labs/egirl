name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        ref: [32278b754afaae25ddc5ef7ef8fe999233f32cc7, 8ec7e96f6678edb4f62fd702caa043fb53011cca]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: timers
        shell: bash
        run: |
          set +e
          timeout 20 bun scripts/ci-debug/timers.ts; echo "timers rc=$?"
          timeout 30 bun test test/tasks/extensions.test.ts --timeout 3000; echo "ext rc=$?"
      - name: per-file
        if: false
        shell: bash
        run: |
          set +e
          for f in $(find test -name '*.test.ts' | sort); do
            start=$(date +%s)
            timeout 60 bun test "$f" > out.txt 2>&1; rc=$?
            echo "$rc $(( $(date +%s)-start ))s $f"
            if [ $rc -ne 0 ]; then tail -40 out.txt; fi
          done
