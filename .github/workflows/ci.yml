name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        ref: [8ec7e96f6678edb4f62fd702caa043fb53011cca]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: timers
        shell: bash
        run: |
          set +e
          cat > scripts_timers.ts <<'TS'
          import { RunDeadline } from './src/tasks/deadline'
          const t0 = Date.now()
          const log = (m: string) => console.log(`${String(Date.now() - t0).padStart(5)}ms ${m}`)
          
          // A: plain re-arm
          await new Promise<void>((resolve) => {
            let h = setTimeout(() => log('A: first timer fired (should not)'), 100)
            clearTimeout(h)
            h = setTimeout(() => { log('A: re-armed timer fired'); resolve() }, 400)
          })
          
          // B: RunDeadline without the sleep
          {
            const d = new RunDeadline(100, () => log('B: onExpire'))
            d.extend(300)
            await d.expired.catch((e) => log(`B: rejected: ${e.message}`))
          }
          
          // C: RunDeadline with Bun.sleep(200) in between, like the test
          {
            const d = new RunDeadline(100, () => log('C: onExpire'))
            d.extend(300)
            await Bun.sleep(200)
            log('C: slept')
            await d.expired.catch((e) => log(`C: rejected: ${e.message}`))
          }
          log('all done')
          TS
          true || cp $GITHUB_WORKSPACE/../timers.ts scripts_timers.ts 2>/dev/null; timeout 20 bun ./scripts_timers.ts; echo "timers rc=$?"
          timeout 30 bun test ./test/tasks/extensions.test.ts --timeout 3000; echo "ext rc=$?"
      - name: per-file
        if: false
        shell: bash
        run: |
          set +e
          for f in $(find test -name '*.test.ts' | sort); do
            start=$(date +%s)
            timeout 60 bun test "$f" > out.txt 2>&1; rc=$?
            echo "$rc $(( $(date +%s)-start ))s $f"
            if [ $rc -ne 0 ]; then tail -40 out.txt; fi
          done
